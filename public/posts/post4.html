        <h2>梅田の定番デートスポット５選</h2>
        <p><time datetime="2025-05-25">2025年5月25日</time></p>
        <div class="article-content">
            <img src="../images/post4-1.jpeg" alt="梅田定番スポット" style="width: 60%; border-radius: 8px;">
            <p>新たな施設が続々とOPTENする梅田エリア。その中でもデートに使えるおすすめスポット５選を紹介します。</p>
            <h3>1. Bar Moxy（モクシー大阪梅田 1F）</h3>
            <img src="../images/post4-2.jpeg" alt="モクシー大阪梅田-1" style="width: 60%; border-radius: 8px;">
            <p>モクシー大阪梅田ホテル内1Fに位置するカフェバー</p>
            <p>開放的な空間にPOPな音楽がマッチする空間に、ソファ席やテーブル席など</p>
            <p>おしゃれなホッケーゲームもあり、気分転換のコンテンツは充実</p>
            <p>グラングリーンより徒歩１０分ほどでの距離にあり、天気の良い日は梅田駅から散歩するにはちょうどよい</p>
            <p>ぜひ休日に行ってみてはどうか</p>
